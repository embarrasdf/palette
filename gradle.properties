org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.tooling.parallel=true

kotlin.code.style=official
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.testOptions.managedDevices.customDevice=true

# Firebase Test Lab results bucket, shared by every module's firebaseTestLab {} block
palette.ftl.bucket=embarrasdf-palette-firebase-test-lab

##################################
# Publishing
##################################

GROUP=com.embarrasdf.palette

SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

POM_DESCRIPTION=Palette
POM_URL=https://github.com/embarrasdf/palette/
POM_SCM_URL=https://github.com/embarrasdf/palette/
POM_SCM_CONNECTION=scm:git:git://github.com/embarrasdf/palette.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://github.com/embarrasdf/palette.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=embarrasdf
POM_DEVELOPER_NAME=embarrasdf
POM_DEVELOPER_URL=https://github.com/embarrasdf/
