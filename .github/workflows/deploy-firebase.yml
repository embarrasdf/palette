name: Deploy to Firebase App Distribution

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary-as-pr-comment: 'on-failure'
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
          working-directory: 'app/androidApp'

      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash

      - name: Create service account key file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/service_account.json

      - name: Decode keystore and create file
        run: echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > app/androidApp/release.jks

      - name: Get commits
        id: get_commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PUSH_COMMITS: ${{ join(github.event.commits.*.message, '\n') }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF:$BASE_REF"
            git fetch origin "$HEAD_REF:$HEAD_REF"
            COMMITS=$(git log "$BASE_REF..$HEAD_REF" --pretty=format:"%h %s")
          else
            # Convert literal \n to real newlines
            COMMITS=$(printf '%b' "$PUSH_COMMITS")
          fi
          # Add asterisks before each commit line
          COMMITS=$(printf '%s\n' "$COMMITS" | sed 's/^/* /')
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Distribute Android App
        working-directory: app/androidApp
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service_account.json
          KEYSTORE_FILE_PATH: "release.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMITS: ${{ steps.get_commits.outputs.commits }}
        run: |
          set -euo pipefail
          # Strip any stray whitespace/newlines that a mis-pasted secret may carry,
          # so it can't truncate the fastlane invocation.
          app_id=$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')
          notes_file=$(mktemp)
          {
            printf 'Branch: %s\n' "$BRANCH_NAME"
            printf 'Commit: %s\n' "${COMMIT_SHA:0:8}"
            printf 'Commits:\n%s\n' "$COMMITS"
          } > "$notes_file"
          bundle exec fastlane distribute_to_firebase \
            firebase_app_id:"$app_id" \
            release_notes_file:"$notes_file"

  ios_distribute:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary-as-pr-comment: 'on-failure'
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
          working-directory: 'app/iosApp'

      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash

      - name: Create service account key file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/service_account.json

      - name: Get commits
        id: get_commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PUSH_COMMITS: ${{ join(github.event.commits.*.message, '\n') }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF:$BASE_REF"
            git fetch origin "$HEAD_REF:$HEAD_REF"
            COMMITS=$(git log "$BASE_REF..$HEAD_REF" --pretty=format:"%h %s")
          else
            # Convert literal \n to real newlines before adding asterisks
            COMMITS=$(printf '%b' "$PUSH_COMMITS")
          fi
          # Add asterisks before each commit line
          COMMITS=$(printf '%s\n' "$COMMITS" | sed 's/^/* /')
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Distribute iOS App
        working-directory: app/iosApp
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service_account.json
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMITS: ${{ steps.get_commits.outputs.commits }}
        run: |
          set -euo pipefail
          # Strip any stray whitespace/newlines that a mis-pasted secret may carry,
          # so it can't truncate the fastlane invocation.
          app_id=$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')
          notes_file=$(mktemp)
          {
            printf 'Branch: %s\n' "$BRANCH_NAME"
            printf 'Commit: %s\n' "${COMMIT_SHA:0:8}"
            printf 'Commits:\n%s\n' "$COMMITS"
          } > "$notes_file"
          bundle exec fastlane distribute_to_firebase \
            firebase_app_id:"$app_id" \
            release_notes_file:"$notes_file"
