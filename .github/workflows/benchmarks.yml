name: Run Benchmarks

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: embarrasdf/devops/.github/workflows/firebase-test-lab.yml@claude/loving-mendel-w26y87-ci-test
    permissions:
      contents: write
    with:
      name: Run Benchmarks
      tasks: :app:benchmark:runBenchmarks
      artifact-name: benchmark-results
      paths: |
        app/benchmark/results/*.json
        app/benchmark/build/outputs/androidTest-results/**/*.perfetto-trace
      commit-paths: app/benchmark/results/*.json
      commit-message: "🤖 Update benchmark results"
      lfs: true
    secrets:
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
