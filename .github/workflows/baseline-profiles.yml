name: Generate Baseline Profiles

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Firebase Test Lab
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.username != 'github-actions[bot]'
    uses: embarrasdf/devops/.github/workflows/firebase-test-lab.yml@main
    permissions:
      contents: write
    with:
      tasks: generateAllBaselineProfiles
      artifact-name: baseline-profiles
      paths: |
        app/androidApp/src/release/generated/baselineProfiles/startup-prof.txt
        components/src/androidMain/generated/baselineProfiles/baseline-prof.txt
        formats/src/androidMain/generated/baselineProfiles/baseline-prof.txt
        modifiers/src/androidMain/generated/baselineProfiles/baseline-prof.txt
      commit-paths: |
        app/androidApp/src/release/generated/baselineProfiles/startup-prof.txt
        components/src/androidMain/generated/baselineProfiles/baseline-prof.txt
        formats/src/androidMain/generated/baselineProfiles/baseline-prof.txt
        modifiers/src/androidMain/generated/baselineProfiles/baseline-prof.txt
      commit-message: "🤖 Update baseline profiles"
      lfs: true
    secrets:
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
